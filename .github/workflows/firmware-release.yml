name: Firmware Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag created by firmware-tag.yml
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-firmware-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag and VERSION
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$ ]]
          tag_type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.type)"
          commit="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)"
          [[ "$tag_type" = commit && "$commit" =~ ^[0-9a-f]{40}$ ]]
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$commit" ]]
          [[ "$(git show "$commit:VERSION" | tr -d '[:space:]')" = "${RELEASE_TAG#v}" ]] || {
            echo "VERSION does not match $RELEASE_TAG." >&2
            exit 1
          }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    uses: ./.github/workflows/firmware-build.yml
    with:
      production: true
      ref: ${{ needs.validate.outputs.commit }}
    secrets: inherit

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          bundle="tinytouch-firmware-${version}.tar.gz"
          (cd dist && sha256sum --check --strict "$bundle.sha256")
          flags=(--verify-tag --generate-notes --latest=false)
          [[ "$version" = *-* ]] && flags+=(--prerelease)
          test -f dist/release/release-manifest.json
          test -f dist/release/tiny_touch_unified.bin
          test -f dist/release/factory/tiny_touch_factory_full.bin
          gh release create "$RELEASE_TAG" "dist/$bundle" "dist/$bundle.sha256" \
            "dist/release/release-manifest.json" "dist/release/tiny_touch_unified.bin" \
            "dist/release/factory/tiny_touch_factory_full.bin" \
            --repo "$GITHUB_REPOSITORY" "${flags[@]}"
