name: App Build

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: App version embedded in the build
        required: false
        default: ""
        type: string
      ref:
        description: Exact commit to build
        required: false
        default: ""
        type: string
    secrets:
      MACOS_SIGNING_CERTIFICATE:
        required: true
      MACOS_SIGNING_CERTIFICATE_PASSWORD:
        required: true
    outputs:
      artifact-name:
        description: Uploaded app artifact name
        value: ${{ jobs.app.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  app:
    runs-on: macos-latest
    outputs:
      artifact-name: ${{ steps.package.outputs.artifact-name }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Test app
        run: swift test
      - name: Import release signing certificate
        if: inputs.version != ''
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          [[ -n "$CERTIFICATE_BASE64" && -n "$CERTIFICATE_PASSWORD" ]]
          certificate="$RUNNER_TEMP/TinyTouch-Release.p12"
          certificate_pem="$RUNNER_TEMP/TinyTouch-Release.pem"
          keychain="$RUNNER_TEMP/TinyTouch-Release.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode -o "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -A -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F '"TinyTouch Release Signing"'
          security find-certificate -c "TinyTouch Release Signing" -p "$keychain" > "$certificate_pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$certificate_pem"
      - name: Build and package app
        id: package
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          xcodebuild -project TinyTouch.xcodeproj -scheme TinyTouch \
            -configuration Release -derivedDataPath "$RUNNER_TEMP/TinyTouchDerived" \
            CODE_SIGNING_ALLOWED=NO build
          app="$RUNNER_TEMP/TinyTouchDerived/Build/Products/Release/TinyTouch.app"
          built_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          [[ -z "$APP_VERSION" || "$built_version" = "$APP_VERSION" ]] || {
            echo "Built app version $built_version does not match release version $APP_VERSION." >&2
            exit 1
          }
          if [[ -n "$APP_VERSION" ]]; then
            codesign --force --deep --options runtime \
              --keychain "$RUNNER_TEMP/TinyTouch-Release.keychain-db" --sign "TinyTouch Release Signing" "$app"
          else
            codesign --force --deep --options runtime --sign - "$app"
          fi
          codesign --verify --deep --strict "$app"
          mkdir -p dist
          bundle=TinyTouch-macOS.zip
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/$bundle"
          (cd dist && shasum -a 256 "$bundle" > "$bundle.sha256")
          echo "artifact-name=tinytouch-app-${APP_VERSION:-ci}" >> "$GITHUB_OUTPUT"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: |
            app/dist/${{ steps.package.outputs.bundle }}
            app/dist/${{ steps.package.outputs.bundle }}.sha256
          if-no-files-found: error
