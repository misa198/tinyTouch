name: App Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the app-v prefix
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: tag-app-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Create app tag and dispatch release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" = refs/heads/master ]] || {
            echo "Run this workflow from master." >&2
            exit 1
          }
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$ ]] || {
            echo "Invalid release version: $VERSION" >&2
            exit 1
          }

          repository="$GITHUB_REPOSITORY"
          tag="app-v$VERSION"
          head="$(gh api "repos/$repository/git/ref/heads/master" --jq .object.sha)"
          [[ "$(gh api "repos/$repository/commits/$head" --jq .commit.verification.verified)" = true ]] || {
            echo "Release commit $head is not verified." >&2
            exit 1
          }
          if tag_sha="$(gh api "repos/$repository/git/ref/tags/$tag" --jq .object.sha 2>/dev/null)"; then
            [[ "$tag_sha" = "$head" ]] || {
              echo "Tag $tag already points to another commit." >&2
              exit 1
            }
          else
            gh api "repos/$repository/git/refs" --method POST \
              -f ref="refs/tags/$tag" -f sha="$head" >/dev/null
          fi

          gh api "repos/$repository/actions/workflows/app-release.yml/dispatches" --method POST \
            -f ref=master -f "inputs[tag]=$tag"
